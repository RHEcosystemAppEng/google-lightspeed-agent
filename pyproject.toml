[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightspeed-agent"
version = "0.1.0"
description = "A2A-ready agent for Red Hat Insights using Google ADK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Red Hat", email = "insights@redhat.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Shared base dependencies (used by both agent and marketplace handler)
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "PyJWT[crypto]>=2.15.1",
    "cryptography>=50.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    # PostgreSQL drivers
    "asyncpg>=0.29.0",  # Async driver for SQLAlchemy async operations
    "psycopg2-binary>=2.9.0",  # Sync PostgreSQL driver (used by alembic migrations)
    # Google Cloud authentication (ADC for Procurement API calls)
    "google-auth>=2.0.0",
    "requests>=2.20.0",  # Required by google.auth.transport.requests
    # GHSA-6q48-6c7w-9gw2: use certifi's release that distrusts compromised eMudhra intermediates
    "certifi>=2026.10.19",
    # CVE-2026-97687/97688/97689: urllib3 security fixes
    "urllib3>=2.8.0",
    # Redis for distributed rate limiting (used by both agent and marketplace handler)
    # CVE-2026-81934: Update to latest client (8.1.0) for compatibility with patched servers
    "redis>=8.1.0",
    # Structured JSON logging with proper value escaping (CWE-117 safe)
    "python-json-logger>=3.0.0",
    # CVE-2026-59885: pyasn1 < 0.6.4 OID decoding quadratic time DoS
    "pyasn1>=0.6.4",
]

[project.optional-dependencies]
agent = [
    # AI/Agent frameworks
    "aiohttp>=3.14.4",
    # CVE-2026-104874: older C-extension items-view operations leak references
    "multidict>=6.9.1",
    "google-adk==2.4.0",
    # CVE-2026-96760: Authlib JWS JSON deserialization accepts empty signatures before 1.9.0
    # CVE-2026-114616: Authlib < 1.9.1 accepts zero-length HMAC key material, letting a
    # remote attacker forge HS256/HS384/HS512 tokens when a secret lookup returns empty
    # CVE-2026-104056: metadata-origin validation is not confirmed fixed in 1.9.1;
    # this agent does not use Authlib's discovery client.
    "authlib>=1.9.1,<2.0.0",
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    # CVE: fsspec ReferenceFileSystem template evaluation allows code execution before 2026.6.0
    "fsspec>=2026.6.0",
    # CVE-2026-84377: litellm < 1.96.2 proxy request validation allows credential exfiltration
    # litellm < 1.101.0-rc.1: semantic cache tenant isolation bypass (proxy-only, not exploitable
    # here since litellm is only used as a client SDK, but pinned above the fix as defense-in-depth)
    # CVE-2026-114612: proxy admin privilege escalation via salt-key reuse (also proxy-only;
    # fixed in 1.103.1, pinned above the fix as defense-in-depth)
    "litellm>=1.103.1,<2.0.0",
    "mcp==1.30.0",
    # Configuration
    "python-dotenv>=1.2.2",
    # Google Cloud integration
    "google-cloud-service-control>=1.0.0",
    # OpenTelemetry for distributed tracing
    # CVE-2026-112006: opentelemetry-exporter-otlp-proto-http < 1.45.0 disables
    # TLS verification when OTEL_EXPORTER_OTLP_CERTIFICATE (or a per-signal
    # variant) is set to an empty string. The fixed 1.45.0 cannot be used here:
    # google-adk (all releases through 2.12.0) caps opentelemetry-sdk at
    # <= 1.42.1 while opentelemetry-exporter-otlp-proto-http >= 1.44 requires
    # sdk ~= 1.44. Mitigated in lightspeed_agent.telemetry.setup by dropping
    # empty certificate variables before exporters are constructed.
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
    "opentelemetry-exporter-prometheus>=0.62b1",
    # joserfc < 1.7.2: JWT trailing-padding malleability bypass
    # CVE-2026-75509/102946: JWT issuer-validation and JWS signature-verification bypasses
    # CVE-2026-119283/119284: unbounded JWE recipient processing and JWS memory allocation
    "joserfc>=1.7.6",
]
telemetry = [
    "opentelemetry-exporter-jaeger>=1.20.0",
    "opentelemetry-exporter-zipkin>=1.20.0",
]
eval = [
    # CVE-2026-115886: mlflow scorer deserialization allows SSRF from the (unauthenticated)
    # scorer invoke/register/GenAI evaluate endpoints, fixed in 3.17.0
    # CVE-2026-53995: FileStore path traversal via crafted trace IDs, fixed in 3.17.2
    # (not exploitable in the deployed server, which requires the PostgreSQL backend,
    # but pinned above the fix as defense-in-depth)
    "mlflow>=3.17.2",
    # CVE-2026-112390/112391/112406: fix MIC frame counting and PDF denial of service
    "pillow>=13.0.0",
    # CVE-2026-110855/110856/110857/110859/114145: fix GitPython issues in the eval environment
    "gitpython>=3.2.1",
    # CVE-2026-112006: empty OTEL_EXPORTER_OTLP_CERTIFICATE disables TLS
    # verification in opentelemetry-exporter-otlp-proto-http before 1.45.0
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    # CVE-2026-104874: keep the eval environment on the fixed multidict release
    "multidict>=6.9.1",
    # PYSEC-2026-4312: keep the eval environment on the fixed werkzeug release
    "werkzeug>=3.1.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    # CVE-2026-104843 / GHSA-hq85-5cpj-mr62: Windows wheel traversal and unsafe CA bundle
    "uv>=0.13.4",
    "pip-audit>=2.7.0",
    # PYSEC-2026-3721: pip < 26.2 vulnerability
    "pip==26.2.1",
    # CVE-2026-114613: msgpack < 1.2.3 leaks a decoded map value when strict_map_key
    # rejects a key, allowing unbounded memory growth on malformed input
    "msgpack>=1.2.3",
]

[project.scripts]
lightspeed-agent = "lightspeed_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightspeed_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
