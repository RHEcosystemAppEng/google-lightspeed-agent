{{- if and .Values.mlflow.enabled (eq .Values.mlflow.mode "self-deployed") (eq .Values.mlflow.postgresql.mode "dedicated") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lightspeed-agent.mlflowPostgresqlServiceName" . }}
  labels:
    {{- include "lightspeed-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow-database
spec:
  podSelector:
    matchLabels:
      {{- include "lightspeed-agent.mlflowPostgresqlSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "lightspeed-agent.mlflowSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
